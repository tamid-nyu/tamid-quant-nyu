# Predictor v2 event calendar (spec section 5, F-event). Dates are New York calendar dates (YYYY-MM-DD),
# span 2024-07-01 .. 2027-06-30. Actual release dates are used where releases moved (rescheduled dates were
# published before the release, so this is not lookahead). A cancelled release has no date.
#
# Moved / cancelled releases (see task-4-report.md for the full ledger):
#   CPI:  Sep-2025 data 2025-10-24; Oct-2025 data CANCELLED (no date);
#         Nov-2025 data 2025-12-18; Jan-2026 data 2026-02-13.
#   Jobs: Sep-2025 data 2025-11-20; Oct-2025 payrolls folded into the 2025-12-16 release; Nov-2025 data 2025-12-16;
#         Jan-2026 data 2026-02-11.
#   EIA petroleum: actual release dates from the EIA WPSR archive through 2026-11-12; later dates use
#         the EIA published holiday schedule (Thu 2027-01-21, 2027-02-18, 2027-06-03) else Wednesday.
#   EIA gas: Thursday except EIA published holiday exceptions.
#
# UNCONFIRMED SPANS (no official source yet; standard weekday used, not guessed beyond that):
#   - FOMC 2027 dates are tentative on federalreserve.gov (confirmed at the preceding meeting).
#   - EIA gas storage: EIA has published exceptions only through 2026-11-25. 2026-11-26 .. 2027-06-30 uses
#     Thursday for every week (no federal holiday falls on a Thursday in that span).
#   - EIA gas 2024-07-01 .. 2024-12-31 exceptions come from EIA's gas schedule as indexed in search results
#     (irtest/ngs_test mirror); the live schedule page now shows only 2025+.
#   - EIA gas 2025-12-29 (Christmas week): the live ir.eia.gov page says Mon 2025-12-29; an older copy said
#     Wed 2025-12-24. Live page used.
#   - Unscheduled FOMC notation vote 2025-08-22 has no meeting statement; excluded.
